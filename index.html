:root {
  --navy: #12263a;
  --teal: #0f766e;
  --sand: #f6f1e8;
  --ink: #102033;
  --muted: #5b6b7c;
  --line: #e4ddd2;
  --white: #fff;
}
* { box-sizing: border-box; }
html {
  scroll-behavior: smooth;
  /* banner (~42px) + nav (~66px) so hash targets aren't hidden under sticky chrome */
  scroll-padding-top: 120px;
}
body {
  margin: 0;
  font-family: "Trebuchet MS", "Segoe UI", sans-serif;
  color: var(--ink);
  background: var(--white);
}
.wrap { width: min(1120px, calc(100% - 28px)); margin: 0 auto; }
.nav {
  position: sticky; top: 0; z-index: 30;
  background: rgba(255,255,255,.94);
  border-bottom: 1px solid var(--line);
}
.nav-in {
  min-height: 66px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  flex-wrap: nowrap;
}
.brand { font-weight: 800; color: var(--navy); text-decoration: none; font-size: 20px; white-space: nowrap; flex-shrink: 0; }
.brand span { color: var(--teal); }
.nav-links {
  display: flex; gap: 10px; align-items: center; flex-wrap: nowrap;
  justify-content: flex-end; min-width: 0;
}
.nav-links a { color: var(--muted); text-decoration: none; font-size: 14px; white-space: nowrap; }
section[id], .form[id], h2 { scroll-margin-top: 120px; }
.lang { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 10px; cursor: pointer; font-weight: 700; }
.btn, button.btn {
  background: var(--teal); color: #fff; border: 0; border-radius: 12px;
  padding: 11px 16px; font-weight: 700; text-decoration: none; display: inline-flex;
  cursor: pointer; font-size: 14px;
}
.btn-ghost { background: #dcefec; color: var(--navy); }
.hero { background: linear-gradient(180deg, #e7f3f1, #fff 72%); padding: 56px 0 40px; }
.hero-grid { display: grid; grid-template-columns: 1.25fr .75fr; gap: 28px; align-items: center; }
.eyebrow { color: var(--teal); font-weight: 800; text-transform: uppercase; letter-spacing: .04em; font-size: 12px; }
h1 { font-size: clamp(30px, 5vw, 48px); line-height: 1.12; margin: 8px 0 14px; }
.lead { color: var(--muted); font-size: 17px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
.stats { background: var(--navy); color: #fff; border-radius: 20px; padding: 24px 22px; }
.stats b { display: block; color: #5eead4; font-size: clamp(26px, 4vw, 34px); line-height: 1.15; }
.stats .stats-main { margin: 8px 0 16px; color: #fff; font-size: 16px; font-weight: 700; line-height: 1.35; }
.stats .stats-sub { margin: 0; color: #a8bdd0; font-size: 13px; line-height: 1.4; }
.stats p { margin: 0 0 14px; color: #d7e3ef; }
section { padding: 56px 0; }
.alt { background: var(--sand); }
h2 { margin: 0 0 8px; font-size: 30px; }
.sub { color: var(--muted); margin: 0 0 22px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.card, .shop, .step, .form, .price {
  background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px;
}
.card h3, .shop h3 { margin: 0 0 6px; font-size: 15px; }
.card p, .shop p, .step p { margin: 0; color: var(--muted); font-size: 13px; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
.step { padding: 20px 18px; min-height: 150px; }
.step b {
  display: inline-flex; align-items: center; justify-content: center;
  width: 42px; height: 42px; border-radius: 999px;
  background: #dcefec; color: var(--teal); font-size: 20px; margin-bottom: 10px;
}
.step h3 { margin: 0 0 8px; font-size: 17px; }
.step p { font-size: 14px; }
.prices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.price strong { display: block; margin-bottom: 8px; }
.shops { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.tag { font-size: 12px; color: var(--teal); font-weight: 800; }
.split { display: grid; grid-template-columns: .85fr 1.15fr; gap: 24px; }
form { display: grid; gap: 10px; }
label { display: grid; gap: 5px; font-size: 13px; font-weight: 700; }
input, select, textarea {
  font: inherit; padding: 10px; border-radius: 10px; border: 1px solid #cfc6b8;
}
footer { background: var(--navy); color: #c9d6e3; padding: 28px 0; }
.map { height: 360px; border-radius: 16px; border: 1px solid var(--line); margin: 12px 0; }
.start-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.start-card {
  background: #fff; border: 2px solid var(--line); border-radius: 16px;
  padding: 18px 14px; text-decoration: none; color: var(--ink); min-height: 110px;
  display: flex; flex-direction: column; gap: 6px;
}
.start-card:hover { border-color: var(--teal); }
.start-card strong { font-size: 18px; }
.start-card span { color: var(--muted); font-size: 14px; }
.radio-bar { margin-top: 22px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.pin {
  background: var(--navy); color: #fff; text-decoration: none;
  border-radius: 999px; padding: 8px 12px; font-size: 13px; font-weight: 700;
}
.help-fab {
  position: fixed; right: 16px; bottom: 16px; z-index: 40;
  background: #f4c542; border: 0; border-radius: 999px; padding: 12px 16px;
  font-weight: 800; cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,.15);
}
.clippy {
  position: fixed; right: 16px; bottom: 70px; z-index: 41; width: min(280px, calc(100% - 24px));
  background: #fffbe6; border: 2px solid #e2b93b; border-radius: 16px; padding: 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,.18);
}
.clippy p { margin: 6px 0; font-size: 14px; }
.clippy-face { font-size: 28px; }
.clippy-name { font-weight: 800; margin: 0 !important; }

.trial-banner {
  position: sticky; top: 0; z-index: 35;
  background: linear-gradient(90deg, #c2410c, #ea580c 40%, #0f766e);
  color: #fff; text-align: center;
  padding: 10px 14px; font-weight: 800; font-size: 15px;
  box-shadow: 0 2px 10px rgba(0,0,0,.12);
}
.trial-banner a {
  color: #fff; text-decoration: none;
  border-bottom: 2px solid rgba(255,255,255,.55);
}
.trial-banner a:hover { border-bottom-color: #fff; }
.nav { top: 0; }
body.has-trial-banner .nav { top: 42px; }
.btn-primary { background: var(--teal); color: #fff; }
.btn-ask {
  background: #fff8e7;
  color: #0a2f8f;
  border: 2px solid #0a2f8f;
  font-weight: 800;
  box-shadow: 0 4px 14px rgba(10,47,143,.18);
}
.btn-ask:hover { background: #0a2f8f; color: #fff; }
.btn-secondary { background: #dcefec; color: var(--navy); }
.btn-ghost { background: #dcefec; color: var(--navy); }
.actions .btn-primary { box-shadow: 0 4px 14px rgba(15,118,110,.28); }
.actions .btn-ask {
  padding: 14px 20px; font-size: 16px; border-radius: 14px;
}
.search-wrap { margin: 0 0 16px; }
.search-wrap input {
  width: 100%; max-width: 420px; font: inherit; padding: 12px 14px;
  border-radius: 12px; border: 1px solid #cfc6b8; background: #fff;
}
.accordion { display: grid; gap: 10px; }
.acc-item {
  background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
}
.acc-head {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: #fff; border: 0; padding: 14px 16px; cursor: pointer; font: inherit; font-weight: 800;
  color: var(--navy); text-align: left;
}
.acc-head:hover { background: #f3faf8; }
.acc-head .acc-count {
  font-size: 12px; font-weight: 700; color: var(--muted);
  background: var(--sand); border-radius: 999px; padding: 4px 10px;
}
.acc-head .acc-chevron { color: var(--teal); transition: transform .2s; }
.acc-item.open .acc-chevron { transform: rotate(180deg); }
.acc-body { display: none; padding: 0 12px 12px; }
.acc-item.open .acc-body { display: block; }
.acc-body .grid { margin-top: 4px; }
.card.clickable { cursor: pointer; transition: border-color .15s, box-shadow .15s; }
.card.clickable:hover { border-color: var(--teal); box-shadow: 0 4px 14px rgba(18,38,58,.08); }
.publish-note {
  margin-top: 18px; background: #e7f3f1; border: 1px solid #b7ddd8;
  border-radius: 14px; padding: 14px 16px;
}
.publish-note strong { color: var(--teal); display: block; margin-bottom: 6px; }
.publish-note ol { margin: 0; padding-left: 18px; color: var(--ink); }
.publish-note li { margin: 4px 0; font-size: 14px; }
.demo-tag {
  display: inline-block; font-size: 11px; font-weight: 800; color: #92400e;
  background: #fef3c7; border-radius: 999px; padding: 2px 8px; margin-bottom: 6px;
}
/* Collapse text nav before it wraps into a tall sticky header */
@media (max-width: 1100px) {
  .nav-links a.nav-text { display: none; }
  .nav-links { gap: 8px; }
  .nav-links .btn { padding: 9px 12px; font-size: 13px; }
  html { scroll-padding-top: 110px; }
  section[id], .form[id], h2 { scroll-margin-top: 110px; }
}
@media (max-width: 820px) {
  .hero-grid, .split, .prices, .start-grid { grid-template-columns: 1fr; }
  .nav-links a:not(.btn) { display: none; }
  .nav-links .btn-ghost { display: none; } /* keep one primary CTA on small screens */
  .trial-banner { font-size: 13px; padding: 9px 10px; }
  body.has-trial-banner .nav { top: 40px; }
  html { scroll-padding-top: 100px; }
  section[id], .form[id], h2 { scroll-margin-top: 100px; }
}

.fx-bar {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px; background: #fff;
}
.fx-bar button {
  border: 0; background: transparent; border-radius: 999px; padding: 5px 10px;
  font: inherit; font-size: 12px; font-weight: 800; color: var(--muted); cursor: pointer;
}
.fx-bar button.active { background: var(--teal); color: #fff; }
.fx-note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
.share-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.share-btn {
  border: 1px solid var(--line); background: #fff; color: var(--navy);
  border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 700; cursor: pointer;
}
.share-btn:hover { border-color: var(--teal); color: var(--teal); }
.share-btn.copied { background: #dcefec; border-color: var(--teal); color: var(--teal); }
.reviews-list { display: grid; gap: 10px; margin-bottom: 18px; }
.review {
  background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px;
}
.review .stars { color: #d97706; font-weight: 800; letter-spacing: 1px; }
.review .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
.stars-pick { display: flex; gap: 4px; flex-wrap: wrap; }
.stars-pick label {
  display: inline-flex; align-items: center; gap: 2px; font-weight: 700;
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; cursor: pointer;
}
.stars-pick input { accent-color: var(--teal); }
.contact-alt {
  margin-top: 22px; background: #fff; border: 1px dashed #b7ddd8;
  border-radius: 14px; padding: 16px;
}
.contact-alt h3 { margin: 0 0 6px; font-size: 16px; color: var(--navy); }
.form-ok {
  display: none; margin-top: 10px; padding: 10px 12px; border-radius: 10px;
  background: #dcfce7; color: #166534; font-weight: 700; font-size: 14px;
}
.form-ok.show { display: block; }
.rules-box {
  background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px;
}
.rules-box summary {
  cursor: pointer; font-weight: 800; color: var(--navy); list-style: none;
}
.rules-box summary::-webkit-details-marker { display: none; }
.rules-box ul { margin: 12px 0 0; padding-left: 18px; color: var(--muted); }
.rules-box li { margin: 6px 0; font-size: 14px; }
.footer-links { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; }
.footer-links a { color: #5eead4; text-decoration: none; font-size: 14px; }
.price-shown { font-weight: 700; color: var(--ink); }

.actions .btn-primary {
  padding: 14px 20px; font-size: 16px; border-radius: 14px;
}
.actions .btn-secondary, .actions .btn-sm {
  padding: 9px 14px; font-size: 13px; background: #eef4f3; color: var(--navy);
  box-shadow: none;
}
.trust-box {
  margin-top: 16px; background: #fff; border: 1px solid var(--line);
  border-radius: 14px; padding: 14px 16px;
}
.trust-box strong { display: block; margin-bottom: 8px; color: var(--navy); font-size: 14px; }
.trust-box ul { margin: 0 0 10px; padding-left: 18px; color: var(--muted); }
.trust-box li { margin: 4px 0; font-size: 13px; }
.trust-box a { color: var(--teal); font-weight: 800; font-size: 13px; text-decoration: none; }
.trust-box a:hover { text-decoration: underline; }
.example-tag {
  display: inline-block; font-size: 11px; font-weight: 800; color: #1e3a5f;
  background: #e0e7ff; border-radius: 999px; padding: 2px 8px; margin-bottom: 6px;
}
.empty-state { color: var(--muted); font-size: 15px; padding: 12px 0; }
.kind-tag-servicio { color: var(--teal); }

</style>

const $ = (s) => document.querySelector(s);
let lang = localStorage.getItem("bcl_lang") || "es";
let currencyMode = localStorage.getItem("bcl_fx") || "both"; // ars | brl | both
const REVIEWS_KEY = "bcl_reviews";
const CONTACT_KEY = "bcl_contact_msgs";

function t() {
  return window.I18N[lang];
}

function parseArsAmount(str) {
  if (!str) return null;
  if (/consultar|a convenir|consultar/i.test(str)) return null;
  const m = String(str).match(/ARS\s*([\d.]+)/i);
  if (!m) return null;
  const n = parseInt(m[1].replace(/\./g, ""), 10);
  return Number.isFinite(n) ? n : null;
}

function formatArs(n) {
  return "ARS " + n.toLocaleString("es-AR");
}

function formatBrlFromArs(n) {
  const brl = n / FX_ARS_PER_BRL;
  return "R$ " + brl.toLocaleString("pt-BR", { maximumFractionDigits: 0 });
}

function displayPrice(priceStr) {
  const ars = parseArsAmount(priceStr);
  if (ars == null) return priceStr;
  if (currencyMode === "ars") return formatArs(ars);
  if (currencyMode === "brl") return formatBrlFromArs(ars);
  return formatArs(ars) + " · " + formatBrlFromArs(ars);
}

function starsHtml(n) {
  const s = Math.max(1, Math.min(5, Number(n) || 1));
  return "★".repeat(s) + "☆".repeat(5 - s);
}

function pageUrl(hash) {
  const base = location.href.split("#")[0].split("?")[0];
  return hash ? base + hash : base;
}

function sharePayload(title, priceLabel, hash) {
  const url = pageUrl(hash);
  const priceBit = priceLabel ? " — " + priceLabel : "";
  const text = (window.SITE.name + ": " + title + priceBit + "\n" + url).trim();
  return { title, text, url };
}

function shareRowHtml(id, title, priceLabel, hash) {
  const dict = t();
  return `<div class="share-row" data-share-id="${id}">
    <button type="button" class="share-btn" data-share="wa" data-title="${escapeAttr(title)}" data-price="${escapeAttr(priceLabel || "")}" data-hash="${escapeAttr(hash || "")}">${dict.shareWa}</button>
    <button type="button" class="share-btn" data-share="copy" data-title="${escapeAttr(title)}" data-price="${escapeAttr(priceLabel || "")}" data-hash="${escapeAttr(hash || "")}">${dict.shareCopy}</button>
    <button type="button" class="share-btn" data-share="native" data-title="${escapeAttr(title)}" data-price="${escapeAttr(priceLabel || "")}" data-hash="${escapeAttr(hash || "")}" ${navigator.share ? "" : "hidden"}>${dict.share}</button>
  </div>`;
}

function escapeAttr(s) {
  return String(s || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}

function escapeHtml(s) {
  return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function sb() {
  if (!window._sb && window.supabase?.createClient && SITE.supabaseUrl && SITE.supabaseKey) {
    window._sb = window.supabase.createClient(SITE.supabaseUrl, SITE.supabaseKey);
  }
  return window._sb;
}
async function fetchListings(kind) {
  const client = sb();
  if (!client) return [];
  let q = client.from('listings').select('*').eq('status','published').order('created_at',{ascending:false}).limit(40);
  if (kind) q = q.eq('kind', kind);
  const { data, error } = await q;
  if (error) { console.warn(error); return []; }
  return data || [];
}
async function insertListing(row) {
  const client = sb();
  if (!client) throw new Error('Supabase no configurado');
  const { data, error } = await client.from('listings').insert(row).select().single();
  if (error) throw error;
  return data;
}

async function fetchReviews() {
  const client = sb();
  if (!client) return { ok: false, rows: [] };
  const { data, error } = await client
    .from('reviews')
    .select('*')
    .eq('status', 'published')
    .order('created_at', { ascending: false })
    .limit(40);
  if (error) {
    console.warn('reviews fetch', error);
    return { ok: false, rows: [] };
  }
  return { ok: true, rows: data || [] };
}

async function insertReview(row) {
  const client = sb();
  if (!client) throw new Error('Supabase no configurado');
  const { data, error } = await client.from('reviews').insert(row).select().single();
  if (error) throw error;
  return data;
}

    const title = row.title || row.rubro || "";
    const zone = row.zone || row.city || row.description || "";

function waDigits(phone) {
  return String(phone || "").replace(/\D/g, "");
}

function listingContactHtml(row) {
  if (!row || !row.whatsapp) return "";
  const digits = waDigits(row.whatsapp);
  if (!digits) return "";
  const label = escapeHtml(row.contact_name || t().phone);
  return `<p style="margin-top:8px"><a class="btn btn-ghost" style="padding:7px 12px;font-size:12px" href="https://wa.me/${digits}" target="_blank" rel="noopener">${label}</a></p>`;
}

function bindShareButtons(root) {
  (root || document).querySelectorAll(".share-btn").forEach((btn) => {
    if (btn.dataset.bound) return;
    btn.dataset.bound = "1";
    btn.addEventListener("click", async (e) => {
      e.preventDefault();
      e.stopPropagation();
      const { title, price, hash } = btn.dataset;
      const payload = sharePayload(title, price, hash);
      const kind = btn.dataset.share;
      if (kind === "wa") {
        window.open("https://wa.me/?text=" + encodeURIComponent(payload.text), "_blank");
      } else if (kind === "copy") {
        try {
          await navigator.clipboard.writeText(payload.text);
        } catch (_) {
          const ta = document.createElement("textarea");
          ta.value = payload.text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
        }
        const prev = btn.textContent;
        btn.textContent = t().shareCopied;
        btn.classList.add("copied");
        setTimeout(() => { btn.textContent = prev; btn.classList.remove("copied"); }, 1600);
      } else if (kind === "native" && navigator.share) {
        try { await navigator.share({ title: payload.title, text: payload.text, url: payload.url }); } catch (_) {}
      }
    });
  });
}

const SERVICE_GROUPS = [
  { id: "oficios", key: "groupOficios" },
  { id: "cuidados", key: "groupCuidados" },
  { id: "tramites", key: "groupTramites" },
  { id: "eventos", key: "groupEventos" },
  { id: "hogar", key: "groupHogar" },
];

let openGroups = new Set(["oficios"]);
let servQuery = "";

function serviceMatches(s, q) {
  if (!q) return true;
  const hay = `${s.es} ${s.pt} ${s.d_es} ${s.d_pt}`.toLowerCase();
  return hay.includes(q);
}

function renderServices() {
  const root = $("#serviciosGrid");
  if (!root) return;
  const dict = t();
  const q = (servQuery || "").trim().toLowerCase();
  const searching = q.length > 0;

  root.innerHTML = SERVICE_GROUPS.map((g) => {
    const items = window.SERVICES.filter((s) => s.group === g.id && serviceMatches(s, q));
    if (!items.length) return "";
    const isOpen = searching || openGroups.has(g.id);
    const cards = items.map((s) => `
      <article class="card clickable" data-rubro="${s.es}" role="button" tabindex="0">
        <h3>${lang === "es" ? s.es : s.pt}</h3>
        <p>${lang === "es" ? s.d_es : s.d_pt}</p>
      </article>`).join("");
    return `
      <div class="acc-item${isOpen ? " open" : ""}" data-group="${g.id}">
        <button type="button" class="acc-head" aria-expanded="${isOpen}">
          <span>${dict[g.key] || g.id}</span>
          <span style="display:flex;align-items:center;gap:8px">
            <span class="acc-count">${items.length}</span>
            <span class="acc-chevron" aria-hidden="true">▾</span>
          </span>
        </button>
        <div class="acc-body"><div class="grid">${cards}</div></div>
      </div>`;
  }).join("") || `<p class="sub">${lang === "es" ? "No hay rubros para esa búsqueda." : "Nenhuma categoria para essa busca."}</p>`;

  root.querySelectorAll(".acc-head").forEach((btn) => {
    btn.addEventListener("click", () => {
      const item = btn.closest(".acc-item");
      const id = item.dataset.group;
      if (openGroups.has(id)) openGroups.delete(id);
      else openGroups.add(id);
      item.classList.toggle("open");
      btn.setAttribute("aria-expanded", item.classList.contains("open"));
    });
  });

  root.querySelectorAll(".card.clickable").forEach((card) => {
    const go = () => {
      const sel = $("#rubroNeed");
      if (sel) sel.value = card.dataset.rubro;
      location.hash = "#pedir";
      $("#pedir")?.scrollIntoView({ behavior: "smooth" });
    };
    card.addEventListener("click", go);
    card.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); }
    });
  });
}

function mapFormToListing(kind, d) {
  const base = {
    status: "published",
    contact_name: (d.nombre || "").trim(),
    whatsapp: (d.whatsapp || "").trim(),
    description: "",
  };
  if (kind === "offer") {
    return {
      ...base,
      kind: "servicio",
      title: (d.rubro || "").trim(),
      rubro: (d.rubro || "").trim(),
      zone: (d.zona || "").trim() || null,
      description: (d.zona || "").trim(),
    };
  }
  if (kind === "product") {
    return {
      ...base,
      kind: "producto",
      title: (d.producto || "").trim(),
      category: (d.categoria || "").trim() || null,
      rubro: (d.categoria || "").trim() || null,
      price_label: (d.precio || "").trim() || "Consultar",
      description: (d.categoria || "").trim(),
    };
  }
  if (kind === "used") {
    return {
      ...base,
      kind: "usado",
      title: (d.producto || "").trim(),
      price_label: (d.precio || "").trim(),
      description: "",
    };
  }
  if (kind === "auction") {
    return {
      ...base,
      kind: "remate",
      title: (d.producto || "").trim(),
      price_min_label: (d.minimo || "").trim(),
      description: "",
    };
  }
  if (kind === "shop") {
    return {
      ...base,
      kind: "comercio",
      title: (d.nombre || "").trim(),
      description: (d.ofertas || "").trim(),
    };
  }
  if (kind === "pin") {
    const lat = d.lat !== undefined && d.lat !== "" ? Number(d.lat) : null;
    const lng = d.lng !== undefined && d.lng !== "" ? Number(d.lng) : null;
    return {
      ...base,
      kind: "comercio",
      title: (d.nombre || "").trim(),
      description: (d.direccion || "").trim(),
      zone: (d.direccion || "").trim() || null,
      lat: Number.isFinite(lat) ? lat : null,
      lng: Number.isFinite(lng) ? lng : null,
    };
  }
  return null;
}

function notifyVictorWa(kind, d, num) {
  // Solo pedidos y comentarios/reclamos llegan a Víctor por WhatsApp.
  // Altas (servicio/venta/usado/remate/comercio) se autogestionan en Supabase.
  if (kind === "need") {
    wa(`BuracodeLuis - PEDIDO\nNombre: ${d.nombre}\nWhatsApp: ${d.whatsapp}\nRubro: ${d.rubro}\nDetalle: ${d.detalle}`, num);
  } else if (kind === "comment") {
    wa(`BuracodeLuis - ${d.tipo}\nNombre: ${d.nombre}\nWhatsApp: ${d.whatsapp}\nMensaje: ${d.mensaje}`, num);
  }
}

document.querySelectorAll("form").forEach((form) => {
  form.addEventListener("submit", async (e) => {
    const kind = form.dataset.kind;
    if (kind === "review-local" || kind === "contact-local") return; // handled separately
    e.preventDefault();
    const d = Object.fromEntries(new FormData(form).entries());
    const num = destNumber(form);
    const listingKinds = new Set(["offer", "product", "used", "auction", "shop", "pin"]);

    if (listingKinds.has(kind)) {
      const row = mapFormToListing(kind, d);
      try {
        if (!row || !row.title || !row.contact_name || !row.whatsapp) {
          throw new Error("incomplete");
        }
        await insertListing(row);
        await Promise.all([renderMarket(), renderShops(), renderPublishedServices()]);
        alert(t().publishOk || "OK");
        form.reset();
        if (kind === "pin") {
          const latEl = document.getElementById("pinLat");
          const lngEl = document.getElementById("pinLng");
          if (latEl) latEl.value = "";
          if (lngEl) lngEl.value = "";
        }
      } catch (err) {
        console.warn(err);
        alert(t().publishFail || "Error");
      }
      return;
    }

    notifyVictorWa(kind, d, num);
  });
});

(function () {
  const el = document.getElementById("map");
  if (!el || !window.L || !window.SITE) return;

  const { lat, lng, zoom } = window.SITE.map;
  const map = L.map("map").setView([lat, lng], zoom);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap",
  }).addTo(map);

  L.marker([lat, lng]).addTo(map).bindPopup("Paso de los Libres · centro");

  (window.DEMO_SHOPS || []).forEach((s, i) => {
    const la = typeof s.lat === "number" ? s.lat : lat + (i - 1.5) * 0.004;
    const ln = typeof s.lng === "number" ? s.lng : lng + (i % 2 === 0 ? 0.005 : -0.004);
    const name = s.es;
    const offer = s.offer_es || "";
    const popup = "<strong>" + name + "</strong><br>" + (s.city || "") +
      (offer ? "<br>" + offer : "");
    L.marker([la, ln]).addTo(map).bindPopup(popup);
  });

  let pin;
  function setPin(la, ln) {
    if (pin) map.removeLayer(pin);
    pin = L.marker([la, ln]).addTo(map);
    document.getElementById("pinLat").value = la.toFixed(6);
    document.getElementById("pinLng").value = ln.toFixed(6);
  }

  map.on("click", (e) => setPin(e.latlng.lat, e.latlng.lng));

  document.getElementById("useGps")?.addEventListener("click", () => {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition((pos) => {
      const la = pos.coords.latitude;
      const ln = pos.coords.longitude;
      map.setView([la, ln], 16);
      setPin(la, ln);
    });
  });
})();

// Music: Mixkit Free License classic rock (CDN + local fallback). Button label: Music.
(function () {
  let audio = null;
  let on = false;
  const SOURCES = [
    "https://assets.mixkit.co/music/954/954.mp3", // How Does it Feel — Michael Ramir C. (Mixkit Free)
    "audio/indie-rock-bg.mp3",
  ];

  function setLabel() {
    const btn = document.getElementById("musicBtn");
    if (btn) btn.textContent = "Music";
  }

  function getAudio() {
    if (audio) return audio;
    audio = new Audio();
    audio.loop = true;
    audio.preload = "auto";
    audio.volume = 0.45;
    let i = 0;
    audio.src = SOURCES[0];
    audio.addEventListener("error", () => {
      i += 1;
      if (i < SOURCES.length) {
        audio.src = SOURCES[i];
        if (on) audio.play().catch(() => {});
      }
    });
    return audio;
  }

  async function start() {
    const a = getAudio();
    try {
      a.currentTime = 0;
      await a.play();
      on = true;
      setLabel();
    } catch (err) {
      console.warn("music play", err);
      // Retry once after a tick (some browsers need a second gesture-adjacent play)
      try {
        await new Promise((r) => setTimeout(r, 50));
        await a.play();
        on = true;
        setLabel();
      } catch (err2) {
        console.warn("music play retry", err2);
      }
    }
  }

  function stop() {
    if (audio) {
      audio.pause();
      try { audio.currentTime = 0; } catch (_) {}
    }
    on = false;
    setLabel();
  }

  const btn = document.getElementById("musicBtn");
  if (btn) {
    btn.textContent = "Music";
    btn.addEventListener("click", (e) => {
      e.preventDefault();
      if (on) stop();
      else start();
    });
  }
})();

</script>
