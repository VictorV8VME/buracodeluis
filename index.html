  <style>
:root {
  --navy: #12263a;
  --teal: #0f766e;
  --sand: #f6f1e8;
  --ink: #102033;
  --muted: #5b6b7c;
  --line: #e4ddd2;
  --white: #fff;
}
* { box-sizing: border-box; }
html {
  scroll-behavior: smooth;
  /* beta banner (~44px) + nav (~66px) so hash targets aren't hidden under sticky chrome */
  scroll-padding-top: 130px;
}
body {
  margin: 0;
  font-family: "Trebuchet MS", "Segoe UI", sans-serif;
  color: var(--ink);
  background: var(--white);
}
.wrap { width: min(1120px, calc(100% - 28px)); margin: 0 auto; }
.nav {
  position: sticky; top: 0; z-index: 30;
  background: rgba(255,255,255,.97);
  backdrop-filter: saturate(1.2) blur(10px);
  -webkit-backdrop-filter: saturate(1.2) blur(10px);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 2px 14px rgba(18,38,58,.07);
}
.nav-in {
  min-height: 66px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  flex-wrap: wrap; padding: 8px 0;
}
.brand { font-weight: 800; color: var(--navy); text-decoration: none; font-size: 20px; white-space: nowrap; flex-shrink: 0; letter-spacing: -.01em; }
.brand span { color: var(--teal); }
.nav-links {
  display: flex; gap: 10px 12px; align-items: center; flex-wrap: wrap;
  justify-content: flex-end; min-width: 0; row-gap: 8px;
}
.nav-links a { color: var(--muted); text-decoration: none; font-size: 14px; white-space: nowrap; }
.nav-links .btn, .nav-links .lang, .nav-links .fx-bar {
  position: relative; z-index: 1; flex: 0 0 auto;
}
section[id], .form[id], h2 { scroll-margin-top: 130px; }
.lang { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 10px; cursor: pointer; font-weight: 700; }
.btn, button.btn {
  background: var(--teal); color: #fff; border: 0; border-radius: 12px;
  padding: 11px 16px; font-weight: 700; text-decoration: none; display: inline-flex;
  cursor: pointer; font-size: 14px;
}
.btn-ghost { background: #dcefec; color: var(--navy); }
.hero {
  position: relative;
  padding: 64px 0 52px;
  color: #f8fafc;
  background: var(--navy) url("assets/hero-oficios.jpg") center / cover no-repeat;
  isolation: isolate;
}
.hero::before {
  content: "";
  position: absolute; inset: 0; z-index: 0;
  background: linear-gradient(115deg, rgba(18,38,58,.92) 0%, rgba(18,38,58,.78) 48%, rgba(15,118,110,.55) 100%);
}
.hero > .wrap { position: relative; z-index: 1; }
.hero-grid { display: grid; grid-template-columns: 1fr; gap: 22px; max-width: 720px; }
.eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  margin: 0; padding: 8px 14px; border-radius: 999px;
  background: var(--navy); color: #fff;
  font-weight: 800; text-transform: uppercase; letter-spacing: .06em; font-size: 12px;
  box-shadow: 0 6px 18px rgba(18,38,58,.18);
}
.eyebrow::before {
  content: ""; width: 8px; height: 8px; border-radius: 50%;
  background: #5eead4; flex-shrink: 0;
}
.eyebrow.badge-loud {
  padding: 10px 16px; font-size: 13px; letter-spacing: .08em;
  background: #0f766e; color: #ecfdf5;
  box-shadow: 0 8px 22px rgba(15,118,110,.35);
  border: 2px solid #134e4a;
}
.eyebrow.badge-loud::before { width: 10px; height: 10px; background: #facc15; }

h1 { font-size: clamp(30px, 5vw, 48px); line-height: 1.12; margin: 12px 0 14px; color: var(--ink); }
.hero h1 { color: #fff; }
h1 .hero-accent {
  display: block; margin-top: 4px;
  color: var(--teal); font-weight: 800;
}
.hero h1 .hero-accent { color: #5eead4; }
.lead { color: var(--muted); font-size: 17px; max-width: 36em; }
.hero .lead { color: #d7e3ef; }
.hero-visual { display: grid; gap: 14px; }
.hero-photo {
  margin: 0; border-radius: 20px; overflow: hidden;
  border: 1px solid var(--line); background: #dcefec;
  aspect-ratio: 4 / 3; max-height: 280px;
}
.hero-photo img {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.actions {
  display: flex; gap: 12px; flex-wrap: wrap; margin-top: 22px;
  align-items: center; position: relative;
}
.actions > .btn {
  position: relative; z-index: 1; flex: 0 1 auto;
  white-space: normal; text-align: center; max-width: 100%;
}
.stats { background: var(--navy); color: #fff; border-radius: 20px; padding: 24px 22px; }
.stats b { display: block; color: #5eead4; font-size: clamp(26px, 4vw, 34px); line-height: 1.15; }
.stats .stats-main { margin: 8px 0 16px; color: #fff; font-size: 16px; font-weight: 700; line-height: 1.35; }
.stats .stats-sub { margin: 0; color: #a8bdd0; font-size: 13px; line-height: 1.4; }
.stats p { margin: 0 0 14px; color: #d7e3ef; }
section { padding: 56px 0; }
.alt { background: #f3f4f6; }
.alt-teal { background: #e8f5f1; }
.btn-wa {
  background: #25D366; color: #fff;
  box-shadow: 0 4px 14px rgba(37,211,102,.32);
}
.btn-wa:hover { background: #1ebe5d; color: #fff; }
.nav-links .btn-wa { padding: 9px 14px; }
.btn-nav-wa {
  background: #25D366; color: #fff; border: 0; border-radius: 12px;
  padding: 9px 14px; font-weight: 800; text-decoration: none; display: inline-flex;
  align-items: center; gap: 6px; font-size: 13px;
}
.btn-nav-wa:hover { background: #1ebe5d; color: #fff; }
h2 { margin: 0 0 8px; font-size: 30px; }
.sub { color: var(--muted); margin: 0 0 22px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.card, .shop, .step, .form, .price {
  background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px;
}
.card h3, .shop h3 { margin: 0 0 6px; font-size: 15px; }
.card p, .shop p, .step p { margin: 0; color: var(--muted); font-size: 13px; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
.step { padding: 20px 18px; min-height: 150px; }
.step b {
  display: inline-flex; align-items: center; justify-content: center;
  width: 42px; height: 42px; border-radius: 999px;
  background: #dcefec; color: var(--teal); font-size: 20px; margin-bottom: 10px;
}
.step h3 { margin: 0 0 8px; font-size: 17px; }
.step p { font-size: 14px; }
.prices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.price strong { display: block; margin-bottom: 8px; }
.shops { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.tag { font-size: 12px; color: var(--teal); font-weight: 800; }
.split { display: grid; grid-template-columns: .85fr 1.15fr; gap: 24px; }
form { display: grid; gap: 10px; }
label { display: grid; gap: 5px; font-size: 13px; font-weight: 700; }
input, select, textarea {
  font: inherit; padding: 10px; border-radius: 10px; border: 1px solid #cfc6b8;
}
footer { background: var(--navy); color: #c9d6e3; padding: 22px 0; }
footer .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; }
footer .footer-brand { margin: 0; font-weight: 800; color: #fff; font-size: 16px; }
footer .footer-copy { margin: 0; font-size: 12px; color: #8aa0b5; width: 100%; }
.map { height: 360px; border-radius: 16px; border: 1px solid var(--line); margin: 12px 0; }
.start-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 640px; }
.start-card {
  background: #fff; border: 2px solid var(--line); border-radius: 16px;
  padding: 18px 14px; text-decoration: none; color: var(--ink); min-height: 110px;
  display: flex; flex-direction: column; gap: 6px;
}
.start-card:hover { border-color: var(--teal); }
.start-card strong { font-size: 18px; }
.start-card span { color: var(--muted); font-size: 14px; }
.radio-bar { margin-top: 22px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.pin {
  background: var(--navy); color: #fff; text-decoration: none;
  border-radius: 999px; padding: 8px 12px; font-size: 13px; font-weight: 700;
}
.help-fab {
  position: fixed; right: 16px; bottom: 16px; z-index: 40;
  background: #f4c542; border: 0; border-radius: 999px; padding: 12px 16px;
  font-weight: 800; cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,.15);
}
.clippy {
  position: fixed; right: 16px; bottom: 70px; z-index: 41; width: min(280px, calc(100% - 24px));
  background: #fffbe6; border: 2px solid #e2b93b; border-radius: 16px; padding: 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,.18);
}
.clippy p { margin: 6px 0; font-size: 14px; }
.clippy-face { font-size: 28px; }
.clippy-name { font-weight: 800; margin: 0 !important; }

.beta-banner {
  position: sticky; top: 0; z-index: 35;
  background: linear-gradient(90deg, #0f766e, #0d9488 45%, #12263a);
  color: #fff; text-align: center;
  padding: 10px 14px; font-weight: 800; font-size: 15px;
  line-height: 1.35;
  box-shadow: 0 2px 10px rgba(0,0,0,.12);
}
.beta-banner a {
  color: #fff; text-decoration: none;
  border-bottom: 2px solid rgba(255,255,255,.55);
}
.beta-banner a:hover { border-bottom-color: #fff; }
.nav { top: 0; }
body.has-beta-banner .nav { top: 44px; }
.btn-primary { background: var(--teal); color: #fff; }
.btn-ask {
  background: #fff8e7;
  color: #0a2f8f;
  border: 2px solid #0a2f8f;
  font-weight: 800;
  box-shadow: 0 4px 14px rgba(10,47,143,.18);
}
.btn-ask:hover { background: #0a2f8f; color: #fff; }
.hero .btn-ask {
  background: rgba(255,248,231,.95);
  border-color: #fef08a;
  color: #12263a;
}
.hero .btn-ask:hover { background: #fef08a; color: #12263a; }
.btn-secondary { background: #dcefec; color: var(--navy); }
.btn-ghost { background: #dcefec; color: var(--navy); }
.actions .btn-primary { box-shadow: 0 4px 14px rgba(15,118,110,.28); }
.actions .btn-wa { padding: 14px 20px; font-size: 16px; border-radius: 14px; }
.actions .btn-ask {
  padding: 14px 20px; font-size: 16px; border-radius: 14px;
}
.search-wrap { margin: 0 0 16px; }
.search-wrap input {
  width: 100%; max-width: 420px; font: inherit; padding: 12px 14px;
  border-radius: 12px; border: 1px solid #cfc6b8; background: #fff;
}
.accordion { display: grid; gap: 10px; }
.acc-item {
  background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
}
.acc-head {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: #fff; border: 0; padding: 14px 16px; cursor: pointer; font: inherit; font-weight: 800;
  color: var(--navy); text-align: left;
}
.acc-head:hover { background: #f3faf8; }
.acc-head .acc-count {
  font-size: 12px; font-weight: 700; color: var(--muted);
  background: var(--sand); border-radius: 999px; padding: 4px 10px;
}
.acc-head .acc-chevron { color: var(--teal); transition: transform .2s; }
.acc-item.open .acc-chevron { transform: rotate(180deg); }
.acc-body { display: none; padding: 0 12px 12px; }
.acc-item.open .acc-body { display: block; }
.acc-body .grid { margin-top: 4px; }
.card.clickable { cursor: pointer; transition: border-color .15s, box-shadow .15s; }
.card.clickable:hover { border-color: var(--teal); box-shadow: 0 4px 14px rgba(18,38,58,.08); }
.publish-note {
  margin-top: 18px; background: #e7f3f1; border: 1px solid #b7ddd8;
  border-radius: 14px; padding: 14px 16px;
}
.publish-note strong { color: var(--teal); display: block; margin-bottom: 6px; }
.publish-note ol { margin: 0; padding-left: 18px; color: var(--ink); }
.publish-note li { margin: 4px 0; font-size: 14px; }
.demo-tag {
  display: inline-block; font-size: 11px; font-weight: 800; color: #92400e;
  background: #fef3c7; border-radius: 999px; padding: 2px 8px; margin-bottom: 6px;
}

.mvp-later { display: none !important; }
.start-card.muted, .soon-card {
  background: #f3f4f6; border-style: dashed; color: var(--muted); cursor: default;
  pointer-events: none;
}
.start-card.muted:hover { border-color: var(--line); }

/* Collapse text nav before it wraps into a tall sticky header */
@media (max-width: 1100px) {
  .nav-links a.nav-text { display: none; }
  .nav-links { gap: 8px; }
  .nav-links .btn { padding: 9px 12px; font-size: 13px; }
  html { scroll-padding-top: 120px; }
  section[id], .form[id], h2 { scroll-margin-top: 120px; }
}
@media (max-width: 820px) {
  .hero-grid, .split, .prices, .start-grid { grid-template-columns: 1fr; }
  .nav-links a:not(.btn):not(.btn-nav-wa) { display: none; }
  .nav-links .btn-wa[href="#ofrecer"] { display: none; } /* keep ask + WhatsApp on small screens */
  .nav-fx-wrap .fx-tip { display: none; } /* full fxNote stays under prices */
  .beta-banner { font-size: 13px; padding: 9px 10px; }
  body.has-beta-banner .nav { top: 42px; }
  html { scroll-padding-top: 110px; }
  section[id], .form[id], h2 { scroll-margin-top: 110px; }
  .actions { gap: 12px; }
  .actions > .btn { width: auto; min-width: min(100%, 220px); }
}

.fx-bar {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px; background: #fff;
}
.fx-bar button {
  border: 0; background: transparent; border-radius: 999px; padding: 5px 10px;
  font: inherit; font-size: 12px; font-weight: 800; color: var(--muted); cursor: pointer;
}
.fx-bar button.active { background: var(--teal); color: #fff; }
.fx-note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
.fx-tip {
  display: none;
}
.nav-fx-wrap { display: inline-flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.nav-fx-wrap .fx-tip {
  display: block; font-size: 10px; color: var(--muted); max-width: 160px; line-height: 1.2; text-align: right;
}
.trust-inline {

  background: #fff; border: 1px solid var(--line); max-width: 520px;
}

.trust-inline a:hover { text-decoration: underline; }
.what-is {

}
.legal-page { padding: 40px 0 24px; }
.legal-page h2 { margin: 0 0 8px; font-size: 22px; color: var(--navy); }

}
.legal-page .legal-updated {

}
.legal-page p, .legal-page li { color: var(--muted); font-size: 14px; line-height: 1.55; }

}
.legal-page .legal-report a { color: var(--teal); font-weight: 800; text-decoration: none; }
.legal-page .legal-report a:hover { text-decoration: underline; }
.contact-report { margin: 12px 0 0; font-size: 14px; }
.contact-report a { color: var(--teal); font-weight: 800; }
.dual-cta-hint { margin: 8px 0 0; color: #c7d4e0; font-size: 13px; font-weight: 700; }
.hero-ask {
  margin: 0 0 6px; font-size: 16px; font-weight: 800; color: #fef08a;
}
.hero .benefit-list li { color: #e8eef5; }
.hero .benefit-list .bi { background: rgba(254,240,138,.2); color: #fef08a; }
.hero .trust-inline {
  background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.22);
  backdrop-filter: blur(6px);
}
.hero .trust-inline strong { color: #fff; }
.hero .trust-inline .trust-short { color: #c9d6e3; }
.hero .trust-inline a { color: #5eead4; }
.hero .rubro-chip { color: #e8eef5; }
.hero .rubro-chip .ri {
  background: rgba(255,255,255,.12); border-color: rgba(94,234,212,.45); color: #fff;
}

.hero-stats-inline {
  display: flex; flex-wrap: wrap; gap: 10px 18px; margin-top: 8px;
  padding: 14px 16px; border-radius: 14px;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18);

}
.hero-stats-inline b { color: #5eead4; font-size: 18px; }
.hero-stats-inline span { color: #c9d6e3; font-size: 13px; }

function t() {
  return window.I18N[lang];

function parseArsAmount(str) {
  if (!str) return null;
  if (/consultar|a convenir|consultar/i.test(str)) return null;
  const m = String(str).match(/ARS\s*([\d.]+)/i);
  if (!m) return null;
  const n = parseInt(m[1].replace(/\./g, ""), 10);
  return Number.isFinite(n) ? n : null;
}

function formatArs(n) {
  return "ARS " + n.toLocaleString("es-AR");
}

function formatBrlFromArs(n) {
  const brl = n / FX_ARS_PER_BRL;
  return "R$ " + brl.toLocaleString("pt-BR", { maximumFractionDigits: 0 });
}

function displayPrice(priceStr) {
  const ars = parseArsAmount(priceStr);
  if (ars == null) return priceStr;
  if (currencyMode === "ars") return formatArs(ars);
  if (currencyMode === "brl") return formatBrlFromArs(ars);
  return formatArs(ars) + " · " + formatBrlFromArs(ars);
}

function starsHtml(n) {
  const s = Math.max(1, Math.min(5, Number(n) || 1));
  return "★".repeat(s) + "☆".repeat(5 - s);
}

function pageUrl(hash) {
  const base = location.href.split("#")[0].split("?")[0];
  return hash ? base + hash : base;
}

function sharePayload(title, priceLabel, hash) {
  const url = pageUrl(hash);
  const priceBit = priceLabel ? " — " + priceLabel : "";
  const text = (window.SITE.name + ": " + title + priceBit + "\n" + url).trim();
  return { title, text, url };
}

function shareRowHtml(id, title, priceLabel, hash) {
  const dict = t();
  return `<div class="share-row" data-share-id="${id}">
    <button type="button" class="share-btn" data-share="wa" data-title="${escapeAttr(title)}" data-price="${escapeAttr(priceLabel || "")}" data-hash="${escapeAttr(hash || "")}">${dict.shareWa}</button>
    <button type="button" class="share-btn" data-share="copy" data-title="${escapeAttr(title)}" data-price="${escapeAttr(priceLabel || "")}" data-hash="${escapeAttr(hash || "")}">${dict.shareCopy}</button>
    <button type="button" class="share-btn" data-share="native" data-title="${escapeAttr(title)}" data-price="${escapeAttr(priceLabel || "")}" data-hash="${escapeAttr(hash || "")}" ${navigator.share ? "" : "hidden"}>${dict.share}</button>
  </div>`;
}

function escapeAttr(s) {
  return String(s || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}

function escapeHtml(s) {
  return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/** Strip NUL bytes from user input before submit / display paths. */
function stripNullBytes(s) {
  return String(s ?? "").replace(/\0/g, "");
}

function sanitizeFormStrings(obj) {
  const out = {};
  for (const [k, v] of Object.entries(obj || {})) {
    out[k] = typeof v === "string" ? stripNullBytes(v) : v;
  }
  return out;
}

function reviewStatsByRubro(reviews) {
  const map = new Map();
  (reviews || []).forEach((r) => {
    const key = String(r.rubro || "").trim().toLowerCase();
    if (!key) return;
    const cur = map.get(key) || { sum: 0, n: 0 };
    cur.sum += Number(r.stars) || 0;
    cur.n += 1;
    map.set(key, cur);
  });
  const out = new Map();
  map.forEach((v, k) => {
    if (v.n > 0) out.set(k, { avg: v.sum / v.n, n: v.n });
  });
  return out;
}

function listingMatchStats(row, statsMap) {
  if (!statsMap || !statsMap.size) return null;
  const candidates = [row.rubro, row.title, row.category]
    .map((x) => String(x || "").trim().toLowerCase())
    .filter(Boolean);
  for (const c of candidates) {
    if (statsMap.has(c)) return statsMap.get(c);
    for (const [k, v] of statsMap) {
      if (c.includes(k) || k.includes(c)) return v;
    }
  }
  return null;
}

    const zone = row.zone || row.city || row.description || "";
    const tag = lang === "es" ? "Servicio" : "Serviço";

const BCL_COOLDOWN_MS = 45000;
function tooSoon(storageKey) {
  try {
    const last = Number(localStorage.getItem(storageKey) || 0);
    if (last && Date.now() - last < BCL_COOLDOWN_MS) return true;
  } catch (_) {}
  return false;
}
function markSubmitTime(storageKey) {
  try { localStorage.setItem(storageKey, String(Date.now())); } catch (_) {}
}

function submitProtectedError(status, body) {
  const err = new Error((body && body.error) || "submit_failed");
  err.status = status;
  err.body = body;
  return err;
}

async function submitProtected(type, payload, captchaToken) {
  const url = SITE.functionsUrl;
  if (!url) throw new Error("functionsUrl missing");
  const token = String(captchaToken || "").trim();
  if (!token) {
    throw submitProtectedError(400, { error: "captcha_required" });
  }
  const headers = { "Content-Type": "application/json" };
  if (SITE.supabaseKey) {
    headers.Authorization = "Bearer " + SITE.supabaseKey;
    headers.apikey = SITE.supabaseKey;
  }
  const res = await fetch(url, {
    method: "POST",
    headers,
    body: JSON.stringify({ type, turnstileToken: token, payload }),
  });
  let body = null;
  try { body = await res.json(); } catch (_) { body = null; }
  if (res.status === 429) throw submitProtectedError(429, body || { error: "rate_limited" });
  // Compat: old EF without "gate" — don't block WhatsApp leads while redeploying
  if (type === "gate" && body && body.error === "bad_type") {
    console.warn("submit-protected missing gate; continuing");
    return true;
  }
  if (!res.ok || !body || !body.ok) {
    throw submitProtectedError(res.status, body || { error: "submit_failed" });
  }
  return true;
}

function getCaptchaToken(form) {
  if (!form) return "";
  ensureCaptchaForForm(form);
  const slot = form.querySelector(".turnstile-slot");
  const wid = slot && slot.dataset.widgetId;
  if (wid != null && wid !== "" && window.turnstile && window.turnstile.getResponse) {
    try {
      const tok = window.turnstile.getResponse(wid);
      if (tok) return tok;
    } catch (_) {}
  }
  const input = form.querySelector('input[name="cf-turnstile-response"]');
  return (input && input.value) || "";
}

function resetCaptcha(form) {
  const slot = form && form.querySelector(".turnstile-slot");
  const wid = slot && slot.dataset.widgetId;
  if (wid != null && wid !== "" && window.turnstile && window.turnstile.reset) {
    try { window.turnstile.reset(wid); } catch (_) {}
  }
}

function alertCaptchaOrFail(err) {
  const status = err && err.status;
  const code = err && err.body && err.body.error;
  if (status === 429 || code === "rate_limited") {
    alert(t().publishSlow || "Slow");
    return;
  }
  if (code === "captcha_required" || code === "captcha_failed" || status === 403) {
    alert(t().captchaFail || t().captchaNeed || "Captcha");
    return;
  }
  alert(t().publishFail || "Error");
}

function renderCaptchaSlot(slot) {
  const key = SITE.turnstileSiteKey;
  if (!slot || !key || !window.turnstile || !window.turnstile.render) return null;
  if (slot.dataset.widgetId) return slot.dataset.widgetId;
  try {
    const id = window.turnstile.render(slot, {
      sitekey: key,
      theme: "light",
      appearance: "always",
      retry: "auto",
    });
    slot.dataset.widgetId = String(id);
    return slot.dataset.widgetId;
  } catch (err) {
    console.warn("captcha render", err);
    return null;
  }
}

function ensureCaptchaForForm(form) {
  if (!form) return;
  const slot = form.querySelector(".turnstile-slot");
  if (!slot) return;
  renderCaptchaSlot(slot);
}

/** Lazy Turnstile: one widget when the user opens a form — avoids ~10 simultaneous challenges that hang. */
function initCaptchaWidgets() {
  const key = SITE.turnstileSiteKey;
  if (!key) return;
  document.querySelectorAll("form").forEach((form) => {
    if (!form.querySelector(".turnstile-slot")) return;
    if (form.dataset.captchaBound) return;
    form.dataset.captchaBound = "1";
    form.addEventListener("focusin", function () { ensureCaptchaForForm(form); });
    form.addEventListener("pointerdown", function () { ensureCaptchaForForm(form); }, { passive: true });
  });
  // Prefetch only the first in-view slot (hero/pedir) so mobile has one widget ready
  try {
    const io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        const form = en.target.closest("form");
        if (form) ensureCaptchaForForm(form);
        io.unobserve(en.target);
      });
    }, { rootMargin: "80px", threshold: 0.15 });
    const first = document.querySelector("form .turnstile-slot");
    if (first) io.observe(first);
  } catch (_) {}
}

function whenCaptchaReady(cb, tries) {
  const n = tries == null ? 40 : tries;
  if (window.turnstile && window.turnstile.render) {
    cb();
    return;
  }
  if (n <= 0) return;
  setTimeout(function () { whenCaptchaReady(cb, n - 1); }, 250);
}

function bindShareButtons(root) {
  (root || document).querySelectorAll(".share-btn").forEach((btn) => {
    if (btn.dataset.bound) return;
    btn.dataset.bound = "1";
    btn.addEventListener("click", async (e) => {
      e.preventDefault();
      e.stopPropagation();
      const { title, price, hash } = btn.dataset;
      const payload = sharePayload(title, price, hash);
      const kind = btn.dataset.share;
      if (kind === "wa") {
        window.open("https://wa.me/?text=" + encodeURIComponent(payload.text), "_blank");
      } else if (kind === "copy") {
        try {
          await navigator.clipboard.writeText(payload.text);
        } catch (_) {
          const ta = document.createElement("textarea");
          ta.value = payload.text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
        }
        const prev = btn.textContent;
        btn.textContent = t().shareCopied;
        btn.classList.add("copied");
        setTimeout(() => { btn.textContent = prev; btn.classList.remove("copied"); }, 1600);
      } else if (kind === "native" && navigator.share) {
        try { await navigator.share({ title: payload.title, text: payload.text, url: payload.url }); } catch (_) {}
      }
    });
  });
}

function renderRealAuctionCards(rows) {
  return rows.map((row, i) => {
    const title = row.title || "";
    const minRaw = row.price_min_label || row.price_label || "";
    const min = displayPrice(minRaw);
    const label = minRaw ? (t().minBid + ": " + min) : "";
    let ends = "";
    if (row.ends_at) {
      try {
        ends = new Date(row.ends_at).toLocaleString(lang === "es" ? "es-AR" : "pt-BR");
      } catch (_) { ends = String(row.ends_at); }
    }
    return `
    <article class="shop">
      ${ends ? `<div class="tag">${escapeHtml((lang === "es" ? "Remate" : "Leilão") + " · " + ends)}</div>` : `<div class="tag">${lang === "es" ? "Remate" : "Leilão"}</div>`}
      <h3>${escapeHtml(title)}</h3>
      ${label ? `<p class="price-shown">${escapeHtml(label)}</p>` : ""}
      ${row.description ? `<p>${escapeHtml(row.description)}</p>` : ""}
      ${listingContactHtml(row)}
      ${shareRowHtml("auc-" + (row.id || i), title, label, "#remates")}
    </article>`;
  }).join("");
}

async function renderMarket() {
  const productsEl = $("#products");
  const usedEl = $("#used");
  const auctionsEl = $("#auctions");
  if (!productsEl || !usedEl || !auctionsEl) return;

  let products = [], used = [], auctions = [];
  try {
    [products, used, auctions] = await Promise.all([
      fetchListings("producto"),
      fetchListings("usado"),
      fetchListings("remate"),
    ]);
  } catch (err) {
    console.warn(err);
  }

  productsEl.innerHTML = products.length ? renderRealProductCards(products) : renderDemoProducts();
  usedEl.innerHTML = used.length ? renderRealUsedCards(used) : renderDemoUsed();
  auctionsEl.innerHTML = auctions.length ? renderRealAuctionCards(auctions) : renderDemoAuctions();
  bindShareButtons(productsEl);
  bindShareButtons(usedEl);
  bindShareButtons(auctionsEl);
}

let reviewsFromSupabase = false;

async function collectReviews() {
  const remote = await fetchReviews();
  reviewsFromSupabase = remote.ok;
  if (remote.ok) {
    // Never fall back to DEMO_/example cards — empty remote = empty UI + form
    return (remote.rows || []).map(mapRemoteReview).filter((r) => !r.demo);
  }
  // Remote failure: no localStorage fallback (would store PII). Empty list only.
  return [];
}

async function renderReviews() {
  const root = $("#reviewsList");
  const teaser = $("#recentReviewsList");

      <a class="btn btn-ghost" href="#comentarios">${escapeHtml(d.reviewSubmit || "")}</a>

function mapFormToListing(kind, d) {
  const base = {
    status: "pending", // moderación: no sale en la home hasta que Victor publique
    contact_name: (d.nombre || "").trim(),
    whatsapp: (d.whatsapp || "").trim(),
    description: "",
  };
  if (kind === "offer") {
    return {
      ...base,
      kind: "servicio",
      title: (d.rubro || "").trim(),
      rubro: (d.rubro || "").trim(),
      zone: (d.zona || "").trim() || null,
      description: (d.zona || "").trim(),
    };
  }
  if (kind === "product") {
    return {
      ...base,
      kind: "producto",
      title: (d.producto || "").trim(),
      category: (d.categoria || "").trim() || null,
      rubro: (d.categoria || "").trim() || null,
      price_label: (d.precio || "").trim() || "Consultar",
      description: (d.categoria || "").trim(),
    };
  }
  if (kind === "used") {
    return {
      ...base,
      kind: "usado",
      title: (d.producto || "").trim(),
      price_label: (d.precio || "").trim(),
      description: "",
    };
  }
  if (kind === "auction") {
    return {
      ...base,
      kind: "remate",
      title: (d.producto || "").trim(),
      price_min_label: (d.minimo || "").trim(),
      description: "",
    };
  }
  if (kind === "shop") {
    return {
      ...base,
      kind: "comercio",
      title: (d.nombre || "").trim(),
      description: (d.ofertas || "").trim(),
    };
  }
  if (kind === "pin") {
    const lat = d.lat !== undefined && d.lat !== "" ? Number(d.lat) : null;
    const lng = d.lng !== undefined && d.lng !== "" ? Number(d.lng) : null;
    return {
      ...base,
      kind: "comercio",
      title: (d.nombre || "").trim(),
      description: (d.direccion || "").trim(),
      zone: (d.direccion || "").trim() || null,
      lat: Number.isFinite(lat) ? lat : null,
      lng: Number.isFinite(lng) ? lng : null,
    };
  }
  return null;
}

function notifyVictorWa(kind, d, num) {
  // Solo pedidos y comentarios/reclamos llegan a Víctor por WhatsApp.
  // Altas (servicio/venta/usado/remate/comercio) se autogestionan en Supabase.
  if (kind === "need") {
    wa(`${window.SITE.name} - PEDIDO\nNombre: ${d.nombre}\nWhatsApp: ${d.whatsapp}\nRubro: ${d.rubro}\nDetalle: ${d.detalle}`, num);
  } else if (kind === "comment") {
    wa(`${window.SITE.name} - ${d.tipo}\nNombre: ${d.nombre}\nWhatsApp: ${d.whatsapp}\nMensaje: ${d.mensaje}`, num);
  }
}

document.querySelectorAll("form").forEach((form) => {
  form.addEventListener("submit", async (e) => {
    const kind = form.dataset.kind;
    if (kind === "review-local" || kind === "contact-wa") return; // handled separately
    e.preventDefault();
    const d = sanitizeFormStrings(Object.fromEntries(new FormData(form).entries()));
    const num = destNumber(form);
    const listingKinds = new Set(["offer", "product", "used", "auction", "shop", "pin"]);

    if (listingKinds.has(kind)) {
      // Honeypot: bots that fill "website" get a silent fake success.
      if (String(d.website || "").trim()) {
        alert(t().publishOk || "OK");
        form.reset();
        return;
      }
      if (tooSoon("bcl_last_listing")) {
        alert(t().publishSlow || "Slow");
        return;
      }
      const row = mapFormToListing(kind, d);
      try {
        if (!row || !row.title || !row.contact_name || !row.whatsapp) {
          throw new Error("incomplete");
        }
        const waNorm = normalizeWhatsapp(row.whatsapp);
        if (!waNorm) {
          alert(t().publishFail || "Error");
          return;
        }
        row.whatsapp = waNorm;
        row.status = "pending";
        const captchaToken = getCaptchaToken(form);
        if (!captchaToken) {
          alert(t().captchaNeed || "Captcha");
          return;
        }
        await insertListing(row, captchaToken);
        markSubmitTime("bcl_last_listing");
        await Promise.all([renderMarket(), renderShops(), renderPublishedServices()]);
        alert(t().publishOk || "OK");
        form.reset();
        resetCaptcha(form);
        if (kind === "pin") {
          const latEl = document.getElementById("pinLat");
          const lngEl = document.getElementById("pinLng");
          if (latEl) latEl.value = "";
          if (lngEl) lngEl.value = "";
        }
      } catch (err) {
        console.warn(err);
        resetCaptcha(form);
        alertCaptchaOrFail(err);
      }
      return;
    }

    // need / comment: leave browser via WhatsApp — gate with Turnstile + rate limit first
    if (kind === "need" || kind === "comment") {
      const captchaToken = getCaptchaToken(form);
      if (!captchaToken) {
        alert(t().captchaNeed || "Captcha");
        return;
      }
      try {
        await submitProtected("gate", { whatsapp: d.whatsapp || "" }, captchaToken);
        notifyVictorWa(kind, d, num);
        form.reset();
        resetCaptcha(form);
      } catch (err) {
        console.warn(err);
        resetCaptcha(form);
        alertCaptchaOrFail(err);
      }
      return;
    }

    notifyVictorWa(kind, d, num);
  });
});

$("#reviewForm")?.addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target;
  const d = sanitizeFormStrings(Object.fromEntries(new FormData(form).entries()));

  const showReviewOk = () => {
    const ok = $("#reviewOk");
    if (ok) {
      ok.textContent = t().reviewOk || ok.textContent;
      ok.classList.add("show");
      setTimeout(() => ok.classList.remove("show"), 3500);
    }
  };

  // Honeypot: silent fake success (no insert).
  if (String(d.website || "").trim()) {
    form.reset();
    const star5hp = form.querySelector('input[name=stars][value="5"]');
    if (star5hp) star5hp.checked = true;
    showReviewOk();
    return;
  }
  if (tooSoon("bcl_last_review")) {
    alert(t().reviewSlow || "Slow");
    return;
  }

  const entry = {
    id: "u-" + Date.now(),
    name: (d.nombre || "").trim(),
    contact: (d.contacto || "").trim(),
    stars: Number(d.stars) || 5,
    comment: (d.comment || "").trim(),
    city: d.city || "Libres",
    rubro: (d.rubro || "").trim(),
    demo: false,
    ts: Date.now(),
  };
  if (!entry.name || !entry.contact || !entry.comment || !entry.stars) return;

  const captchaToken = getCaptchaToken(form);
  if (!captchaToken) {
    alert(t().captchaNeed || "Captcha");
    return;
  }

  try {
    await insertReview({
      name: entry.name,
      contact: entry.contact,
      stars: entry.stars,
      comment: entry.comment,
      city: entry.city,
      rubro: entry.rubro || null,
      status: "pending",
    }, captchaToken);
    markSubmitTime("bcl_last_review");
    form.reset();
    resetCaptcha(form);
    const star5 = form.querySelector('input[name=stars][value="5"]');
    if (star5) star5.checked = true;
    await renderReviews();
    showReviewOk();
  } catch (err) {
    console.warn("review insert", err);
    resetCaptcha(form);
    const status = err && err.status;
    const code = err && err.body && err.body.error;
    if (status === 429 || code === "rate_limited") {
      alert(t().reviewSlow || t().publishSlow || "Slow");
      return;
    }
    if (code === "captcha_required" || code === "captcha_failed" || status === 403) {
      alert(t().captchaFail || t().captchaNeed || "Captcha");
      return;
    }
    alert(t().publishFail || "Error");
  }
});

(function () {
  const el = document.getElementById("map");
  if (!el || !window.L || !window.SITE) return;

  const { lat, lng, zoom } = window.SITE.map;
  const map = L.map("map").setView([lat, lng], zoom);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap",
  }).addTo(map);

  L.marker([lat, lng]).addTo(map).bindPopup("Paso de los Libres · centro");

  (window.DEMO_SHOPS || []).forEach((s, i) => {
    const la = typeof s.lat === "number" ? s.lat : lat + (i - 1.5) * 0.004;
    const ln = typeof s.lng === "number" ? s.lng : lng + (i % 2 === 0 ? 0.005 : -0.004);
    const name = s.es;
    const offer = s.offer_es || "";
    const popup = "<strong>" + name + "</strong><br>" + (s.city || "") +
      (offer ? "<br>" + offer : "");
    L.marker([la, ln]).addTo(map).bindPopup(popup);
  });

  let pin;
  function setPin(la, ln) {
    if (pin) map.removeLayer(pin);
    pin = L.marker([la, ln]).addTo(map);
    document.getElementById("pinLat").value = la.toFixed(6);
    document.getElementById("pinLng").value = ln.toFixed(6);
  }

  map.on("click", (e) => setPin(e.latlng.lat, e.latlng.lng));

  document.getElementById("useGps")?.addEventListener("click", () => {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition((pos) => {
      const la = pos.coords.latitude;
      const ln = pos.coords.longitude;
      map.setView([la, ln], 16);
      setPin(la, ln);
    });
  });
})();

// Music: Mixkit Free License classic rock (CDN + local fallback). Button label: Music.
(function () {
  let audio = null;
  let on = false;
  const SOURCES = [
    "https://assets.mixkit.co/music/954/954.mp3", // How Does it Feel — Michael Ramir C. (Mixkit Free)
    "audio/indie-rock-bg.mp3",
  ];

  function setLabel() {
    const btn = document.getElementById("musicBtn");
    if (btn) btn.textContent = "Music";
  }

  function getAudio() {
    if (audio) return audio;
    audio = new Audio();
    audio.loop = true;
    audio.preload = "auto";
    audio.volume = 0.45;
    let i = 0;
    audio.src = SOURCES[0];
    audio.addEventListener("error", () => {
      i += 1;
      if (i < SOURCES.length) {
        audio.src = SOURCES[i];
        if (on) audio.play().catch(() => {});
      }
    });
    return audio;
  }

  async function start() {
    const a = getAudio();
    try {
      a.currentTime = 0;
      await a.play();
      on = true;
      setLabel();
    } catch (err) {
      console.warn("music play", err);
      // Retry once after a tick (some browsers need a second gesture-adjacent play)
      try {
        await new Promise((r) => setTimeout(r, 50));
        await a.play();
        on = true;
        setLabel();
      } catch (err2) {
        console.warn("music play retry", err2);
      }
    }
  }

  function stop() {
    if (audio) {
      audio.pause();
      try { audio.currentTime = 0; } catch (_) {}
    }
    on = false;
    setLabel();
  }

  const btn = document.getElementById("musicBtn");
  if (btn) {
    btn.textContent = "Music";
    btn.addEventListener("click", (e) => {
      e.preventDefault();
      if (on) stop();
      else start();
    });
  }
})();
