<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BuracodeLuis — Libres y Uruguaiana</title>
  <meta name="description" content="Servicios y comercios entre Paso de los Libres y Uruguaiana. Sin comisión. Español y portugués." />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <header class="nav">
    <div class="wrap nav-in">
      <a class="brand" href="#inicio">Bura<span>codeLuis</span></a>
      <div class="nav-links">
        <a href="#servicios" data-i="navServ"></a>
        <a href="#venta" data-i="navMarket"></a>
        <a href="#usados" data-i="navUsed"></a>
        <a href="#remates" data-i="navAuction"></a>
        <a href="#start" data-i="startTitle"></a>
        <a href="#mapa" data-i="mapTitle"></a>
        <a href="#comercios" data-i="navShops"></a>
        <button class="lang" id="langBtn" type="button">PT</button>
        <button class="lang" id="musicBtn" type="button" data-i="musicBtn"></button>
        <a class="btn" href="#pedir" data-i="ctaNeed"></a>
      </div>
    </div>
  </header>

  <section class="hero" id="inicio">
    <div class="wrap hero-grid">
      <div>
        <p class="eyebrow" data-i="eyebrow"></p>
        <h1 data-i="heroTitle"></h1>
        <p class="lead" data-i="heroLead"></p>
        <div class="actions">
          <a class="btn" href="#pedir" data-i="heroNeed"></a>
          <a class="btn btn-ghost" href="#ofrecer" data-i="heroOffer"></a>
          <a class="btn btn-ghost" href="#comercio" data-i="heroShop"></a>
          <a class="btn btn-ghost" href="#publicar" data-i="heroSell"></a>
        </div>
      </div>
      <div class="stats">
        <b data-i="stat1n"></b><p data-i="stat1"></p>
        <b data-i="stat2n"></b><p data-i="stat2"></p>
        <b data-i="stat3n"></b><p data-i="stat3"></p>
      </div>
    </div>
  </section>

  <section id="start" class="alt">
    <div class="wrap">
      <h2 data-i="startTitle"></h2>
      <div class="start-grid">
        <a class="start-card" href="#pedir"><strong data-i="startNeed"></strong><span data-i="startNeedD"></span></a>
        <a class="start-card" href="#ofrecer"><strong data-i="startOffer"></strong><span data-i="startOfferD"></span></a>
        <a class="start-card" href="#publicar"><strong data-i="startSell"></strong><span data-i="startSellD"></span></a>
        <a class="start-card" href="#remates"><strong data-i="startAuc"></strong><span data-i="startAucD"></span></a>
      </div>
      <div class="radio-bar">
        <strong data-i="radioTitle"></strong>
        <a class="pin" href="https://radioarg.net/nacional-paso-de-los-libres" target="_blank" rel="noopener" data-i="radioLibres"></a>
        <a class="pin" href="https://radiosaovivo.net/radio-uruguaiana-fm-102-1/" target="_blank" rel="noopener" data-i="radioBr"></a>
      </div>
    </div>
  </section>

  <section id="servicios">
    <div class="wrap">
      <h2 data-i="servTitle"></h2>
      <p class="sub" data-i="servLead"></p>
      <div class="grid" id="serviciosGrid"></div>
    </div>
  </section>

  <section class="alt" id="como">
    <div class="wrap">
      <h2 data-i="howTitle"></h2>
      <div class="steps" id="steps"></div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <h2 data-i="priceTitle"></h2>
      <div class="prices">
        <div class="price"><strong>Clientes</strong><p data-i="priceClient"></p></div>
        <div class="price"><strong>Proveedores</strong><p data-i="priceProv"></p></div>
        <div class="price"><strong>Comercios</strong><p data-i="priceShop"></p></div>
      </div>
    </div>
  </section>

  <section id="venta">
    <div class="wrap">
      <h2 data-i="marketTitle"></h2>
      <p class="sub" data-i="marketLead"></p>
      <div class="shops" id="products"></div>
    </div>
  </section>

  <section class="alt" id="usados">
    <div class="wrap">
      <h2 data-i="usedTitle"></h2>
      <p class="sub" data-i="usedLead"></p>
      <div class="shops" id="used"></div>
    </div>
  </section>

  <section id="remates">
    <div class="wrap">
      <h2 data-i="auctionTitle"></h2>
      <p class="sub" data-i="auctionLead"></p>
      <div class="shops" id="auctions"></div>
    </div>
  </section>

  <section class="alt" id="publicar">
    <div class="wrap split">
      <div>
        <h2 data-i="sellProduct"></h2>
        <p class="sub" data-i="marketLead"></p>
      </div>
      <form class="form" data-kind="product">
        <label><span data-i="name"></span><input name="nombre" required /></label>
        <label><span data-i="phone"></span><input name="whatsapp" required /></label>
        <label><span data-i="rubro"></span><select name="categoria" id="catProduct" required></select></label>
        <label><span data-i="productName"></span><input name="producto" required /></label>
        <label><span data-i="price"></span><input name="precio" placeholder="ARS ..." /></label>
        <button class="btn" type="submit" data-i="send"></button>
      </form>
    </div>
    <div class="wrap split" style="margin-top:28px">
      <div>
        <h2 data-i="sellUsed"></h2>
        <p class="sub" data-i="usedLead"></p>
      </div>
      <form class="form" data-kind="used">
        <label><span data-i="name"></span><input name="nombre" required /></label>
        <label><span data-i="phone"></span><input name="whatsapp" required /></label>
        <label><span data-i="productName"></span><input name="producto" required /></label>
        <label><span data-i="price"></span><input name="precio" required /></label>
        <button class="btn" type="submit" data-i="send"></button>
      </form>
    </div>
    <div class="wrap split" style="margin-top:28px">
      <div>
        <h2 data-i="sellAuction"></h2>
        <p class="sub" data-i="auctionLead"></p>
      </div>
      <form class="form" data-kind="auction">
        <label><span data-i="name"></span><input name="nombre" required /></label>
        <label><span data-i="phone"></span><input name="whatsapp" required /></label>
        <label><span data-i="productName"></span><input name="producto" required /></label>
        <label><span data-i="minBid"></span><input name="minimo" required /></label>
        <button class="btn" type="submit" data-i="send"></button>
      </form>
    </div>
  </section>

  <section id="mapa">
    <div class="wrap">
      <h2 data-i="mapTitle"></h2>
      <p class="sub" data-i="mapLead"></p>
      <div id="map" class="map"></div>
      <p class="sub" data-i="mapHint"></p>
      <form class="form" data-kind="pin" style="margin-top:16px">
        <label><span data-i="shopName"></span><input name="nombre" required /></label>
        <label><span data-i="phone"></span><input name="whatsapp" required /></label>
        <label><span data-i="mapAddr"></span><input name="direccion" placeholder="Calle y número" /></label>
        <input type="hidden" name="lat" id="pinLat" />
        <input type="hidden" name="lng" id="pinLng" />
        <div class="actions">
          <button class="btn btn-ghost" type="button" id="useGps" data-i="mapGps"></button>
          <button class="btn" type="submit" data-i="send"></button>
        </div>
      </form>
    </div>
  </section>

  <section class="alt" id="comercios">
    <div class="wrap">
      <h2 data-i="shopsTitle"></h2>
      <p class="sub" data-i="shopsLead"></p>
      <div class="shops" id="shops"></div>
    </div>
  </section>

  <section id="pedir">
    <div class="wrap split">
      <div>
        <h2 data-i="formNeedTitle"></h2>
        <p class="sub" data-i="formNeedLead"></p>
      </div>
      <form class="form" data-kind="need">
        <label><span data-i="name"></span><input name="nombre" required /></label>
        <label><span data-i="phone"></span><input name="whatsapp" required /></label>
        <label><span data-i="rubro"></span><select name="rubro" id="rubroNeed" required></select></label>
        <label><span data-i="detail"></span><textarea name="detalle" rows="4" required></textarea></label>
        <button class="btn" type="submit" data-i="send"></button>
      </form>
    </div>
  </section>

  <section class="alt" id="ofrecer">
    <div class="wrap split">
      <div>
        <h2 data-i="formOfferTitle"></h2>
        <p class="sub" data-i="formOfferLead"></p>
      </div>
      <form class="form" data-kind="offer">
        <label><span data-i="name"></span><input name="nombre" required /></label>
        <label><span data-i="phone"></span><input name="whatsapp" required /></label>
        <label><span data-i="rubro"></span><select name="rubro" id="rubroOffer" required></select></label>
        <label><span data-i="zone"></span><input name="zona" /></label>
        <button class="btn" type="submit" data-i="send"></button>
      </form>
    </div>
  </section>

  <section id="comercio">
    <div class="wrap split">
      <div>
        <h2 data-i="formShopTitle"></h2>
        <p class="sub" data-i="shopsLead"></p>
      </div>
      <form class="form" data-kind="shop">
        <label><span data-i="shopName"></span><input name="nombre" required /></label>
        <label><span data-i="phone"></span><input name="whatsapp" required /></label>
        <label><span data-i="offers"></span><textarea name="ofertas" rows="4" required></textarea></label>
        <button class="btn" type="submit" data-i="send"></button>
      </form>
    </div>
  </section>

  <footer>
    <div class="wrap">
      <p><strong>BuracodeLuis</strong></p>
      <p data-i="footer"></p>
      <p>© 2026 · Propietario y administrador: Víctor Manuel Espíndola</p>
      <p>Paso de los Libres / Uruguaiana · WhatsApp 3772 445319</p>
    </div>
  </footer>

  <button class="help-fab" id="helpOpen" type="button" data-i="helpOpen"></button>
  <aside class="clippy" id="clippy" hidden>
    <div class="clippy-face" aria-hidden="true">📎</div>
    <p class="clippy-name" data-i="helpName"></p>
    <p data-i="helpHi"></p>
    <p data-i="help1"></p>
    <p data-i="help2"></p>
    <p data-i="help3"></p>
    <p data-i="help4"></p>
    <button class="btn" id="helpClose" type="button" data-i="helpClose"></button>
  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/map.js"></script>
  <script src="js/music.js"></script>
</body>
</html>
